name: Build La Finca POS Desktop (.exe / .msi)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - '.github/workflows/build-pos-desktop.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies & Build standalone POS UI
        run: |
          npm ci
          npm run pos:build:ui

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generate Tauri icons from Logo
        run: npx --yes @tauri-apps/cli@^2 icon public/Logo.png --fit contain

      - name: Build Windows Installer (.exe and .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: 'pos-v__VERSION__'
          releaseName: 'La Finca POS v__VERSION__'
          releaseBody: 'Instalador de escritorio Windows (.exe / .msi) para el Punto de Venta de La Finca.'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Installers as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: la-finca-pos-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
