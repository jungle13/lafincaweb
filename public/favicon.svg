<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chocloGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FACC15" />
      <stop offset="85%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="leafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="60%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="leafRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="60%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Cuerpo Mazorca Dorada -->
    <path d="M32 5 C24 13 20 24 20 38 C20 49 25 56 32 58 C39 56 44 49 44 38 C44 24 40 13 32 5 Z" fill="url(#chocloGold)" stroke="#A16207" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Filas y textura de granos de choclo -->
    <path d="M26 15 C25 24 25 35 27 49" stroke="#CA8A04" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M32 7 C32 20 32 35 32 55" stroke="#B45309" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M38 15 C39 24 39 35 37 49" stroke="#CA8A04" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />

    <path d="M25 18 Q32 20 39 18" stroke="#CA8A04" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M23 24 Q32 26 41 24" stroke="#CA8A04" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M21 30 Q32 33 43 30" stroke="#CA8A04" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M21 37 Q32 40 43 37" stroke="#CA8A04" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M22 44 Q32 47 42 44" stroke="#CA8A04" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M25 51 Q32 53 39 51" stroke="#CA8A04" stroke-width="1.2" fill="none" opacity="0.6" />

    <!-- Hoja izquierda verde (Chala) -->
    <path d="M32 58 C22 56 12 48 10 32 C9 24 13 18 13 18 C13 18 16 28 22 36 C27 43 30 52 32 58 Z" fill="url(#leafLeft)" stroke="#14532D" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Hoja derecha verde (Chala) -->
    <path d="M32 58 C42 56 52 48 54 32 C55 24 51 18 51 18 C51 18 48 28 42 36 C37 43 34 52 32 58 Z" fill="url(#leafRight)" stroke="#14532D" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Tallo base -->
    <path d="M29 57 L29 62 C29 63 35 63 35 62 L35 57 Z" fill="#15803D" stroke="#14532D" stroke-width="1.2" />
  </g>
</svg>
