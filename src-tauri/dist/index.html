<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eliana POS</title>
    <style>
      body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #f4f4f5;
        color: #18181b;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .box {
        max-width: 420px;
        width: 90%;
        padding: 32px;
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 12px;
      }
      h2 {
        margin: 0 0 8px 0;
        font-size: 20px;
        font-weight: 700;
        color: #09090b;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #52525b;
      }
      .actions {
        margin-top: 18px;
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      button {
        padding: 9px 16px;
        border-radius: 6px;
        border: none;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button.secondary {
        background: #f4f4f5;
        color: #18181b;
        border: 1px solid #d4d4d8;
      }
      button:hover {
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Eliana POS</h2>
      <p id="status">Iniciando terminal de punto de venta...</p>
      <div class="actions">
        <button onclick="go()">Reintentar conexión</button>
        <button class="secondary" onclick="changeServer()">Cambiar servidor</button>
      </div>
    </div>
    <script>
      const DEFAULT_URL = 'https://lafincaweb.vercel.app/pos';
      function getUrl() {
        return localStorage.getItem('eliana_pos_server_url') || DEFAULT_URL;
      }
      function changeServer() {
        const next = window.prompt('URL del servidor del negocio (ej. https://mi-negocio.vercel.app/pos):', getUrl());
        if (next && next.trim()) {
          localStorage.setItem('eliana_pos_server_url', next.trim());
          go();
        }
      }
      function go() {
        window.location.replace(getUrl());
      }
      go();
    </script>
  </body>
</html>
