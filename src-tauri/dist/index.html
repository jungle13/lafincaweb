<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eliana POS</title>
    <style>
      body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #f4f4f5;
        color: #18181b;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .box {
        max-width: 400px;
        padding: 32px;
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 12px;
      }
      h2 {
        margin: 0 0 8px 0;
        font-size: 20px;
        font-weight: 700;
        color: #09090b;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #52525b;
      }
      button {
        margin-top: 18px;
        padding: 9px 18px;
        border-radius: 6px;
        border: none;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Eliana POS</h2>
      <p id="status">Iniciando terminal de punto de venta...</p>
      <button onclick="go()">Reintentar conexión</button>
    </div>
    <script>
      function go() {
        window.location.replace('https://lafincaweb.vercel.app/pos');
      }
      go();
    </script>
  </body>
</html>
