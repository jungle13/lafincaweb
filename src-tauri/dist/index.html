<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Finca — Punto de Venta</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #020617;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .box {
        max-width: 420px;
        padding: 24px;
      }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 10px;
        border: none;
        background: #ea580c;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>La Finca — Punto de Venta (POS)</h2>
      <p id="status">Conectando con la terminal de La Finca...</p>
      <button onclick="go()">Reintentar conexión</button>
    </div>
    <script>
      function go() {
        window.location.replace('https://lafincaweb.vercel.app/pos');
      }
      go();
    </script>
  </body>
</html>
